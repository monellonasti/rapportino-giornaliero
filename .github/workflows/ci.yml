# Controlli a ogni pull request e su main: app (test, build, database reale, audit) e script Python.
# Nessun segreto: database e configurazione sono solo di test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App Shopify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopify-app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rapportino
          POSTGRES_PASSWORD: solo_ci
          POSTGRES_DB: rapportino_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rapportino"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rapportino:solo_ci@localhost:5432/rapportino_test?schema=public
      DATABASE_URL: postgresql://rapportino:solo_ci@localhost:5432/rapportino_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shopify-app/package-lock.json
      - run: npm ci
      - name: Prisma, TOML, typecheck, test e build
        run: npm run check
      - name: Migrazioni su PostgreSQL (tabelle e trigger di immutabilità)
        run: npm run db:migrate
      - name: Test sul database reale
        run: npm run test:db
      - name: Handler HTTP della build di produzione
        run: npm run test:http
      - name: Audit delle dipendenze di produzione
        run: npm audit --omit=dev --audit-level=moderate

  script:
    name: Script Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-script
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-script/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
